version: "2"

run:
  go: "1.27"
  modules-download-mode: readonly

linters:
  # default "standard" set: errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - gosec
    - misspell
    - revive
  settings:
    gosec:
      excludes:
        - G404  # Use of weak random number generator (math/rand) - ok for non-security use
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
  exclusions:
    generated: lax
    rules:
      # Exclude some linters from running on tests
      - linters:
          - errcheck
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - hateblog
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
